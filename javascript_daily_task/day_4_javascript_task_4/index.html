<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average</title>
</head>
<body>
    <script>
        var python=97;
        var javascript=70;
        var react=80;
        var django=98;
        var tailwind=70;
        var sub=python+javascript+react+django+tailwind;
        document.write("\n Total Subject Mark: "+sub);
        var mark=  sub/500*100;
        document.write("\n Average: "+mark);
      if(mark>=90)
            {
        document.write(" Grade 'O'");
      }
      else if(mark>=80)
      {
        document.write("Grade 'A+'")
      }
      else if(mark>+70)
      {
        document.write("Grade 'B+'")
      }
      else if(mark>=60)
      {
        document.write("Grade B")
      }
      else
      {
        document.write("fail")
      }
    </script>
</body>
</html>
