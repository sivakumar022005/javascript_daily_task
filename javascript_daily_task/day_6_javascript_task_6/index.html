<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>     
      var a=1;
      for(let i=a; 5>=i; i--)
      {
        a=a*i;
        document.write(a)
      }
    </script>
</body>
</html>
